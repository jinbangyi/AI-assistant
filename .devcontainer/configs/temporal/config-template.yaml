# Temporal Server Configuration Template
# This file can be mounted to enable runtime heartbeating and other features

# Note: Runtime heartbeating (worker heartbeating) is enabled by default
# in Temporal Server 1.24.0+ if the server supports it.
# The warning you see is typically harmless and doesn't affect functionality.

# If you need to customize the server configuration, you can:
# 1. Create a custom config file
# 2. Mount it as a volume in docker-compose
# 3. Set TEMPORAL_CONFIG_PATH environment variable

