# version: '3'

services:
  # Nginx reverse proxy for Dify
  dify-nginx:
    image: nginx:alpine
    container_name: dify-nginx
    ports:
      - "8010:80"
    volumes:
      - ./configs/nginx/dify.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dify-api
      - dify-web
    networks:
      - devcontainer-network
    restart: unless-stopped

  # Dify Services
  dify-db:
    image: pgvector/pgvector:pg15
    container_name: dify-db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dify
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - dify-db-data:/var/lib/postgresql/data
    networks:
      - devcontainer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  dify-redis:
    image: redis:7-alpine
    container_name: dify-redis
    # ports:
    #   - "6379:6379"
    volumes:
      - dify-redis-data:/data
    networks:
      - devcontainer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dify-migration:
    image: langgenius/dify-api:latest
    container_name: dify-migration
    environment:
      - MODE=api
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-xxxxx}
      - DATABASE_URL=postgresql://postgres:postgres@dify-db:5432/dify
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres@dify-db:5432/dify
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/api/storage
      - OPENDAL_FS_ROOT=/app/api/storage
    volumes:
      - dify-storage:/app/api/storage
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Waiting for database to be ready..."
        sleep 5
        echo "Running database migrations..."
        cd /app/api
        flask db upgrade
        echo "Migrations completed successfully!"
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    networks:
      - devcontainer-network
    restart: "no"

  dify-storage-init:
    image: langgenius/dify-api:latest
    container_name: dify-storage-init
    user: root
    volumes:
      - dify-storage:/app/api/storage
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Fixing storage permissions..."
        chown -R 1001:1001 /app/api/storage
        chmod -R 755 /app/api/storage
        echo "Storage permissions fixed successfully!"
    networks:
      - devcontainer-network
    restart: "no"

  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify-api
    # expose:
    #   - "5001"
    environment:
      - MODE=api
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-xxxxx}
      - DATABASE_URL=postgresql://postgres:postgres@dify-db:5432/dify
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres@dify-db:5432/dify
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - VECTOR_STORE=pgvector
      - PGVECTOR_HOST=dify-db
      - PGVECTOR_PORT=5432
      - PGVECTOR_USER=postgres
      - PGVECTOR_PASSWORD=postgres
      - PGVECTOR_DB=dify
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://dify-redis:6379/1
      - WEB_API_CORS_ALLOW_ORIGINS=http://localhost:8010,http://127.0.0.1:8010,http://0.0.0.0:8010
      - CONSOLE_CORS_ALLOW_ORIGINS=http://localhost:8010,http://127.0.0.1:8010,http://0.0.0.0:8010
      - CONSOLE_WEB_URL=http://127.0.0.1:8010
      - COOKIE_HTTPONLY=true
      - COOKIE_SAMESITE=Lax
      - COOKIE_SECURE=false
      - SESSION_TYPE=redis
      - SESSION_REDIS_HOST=dify-redis
      - SESSION_REDIS_PORT=6379
      - SESSION_REDIS_DB=2
      - CODE_EXECUTION_ENDPOINT=http://dify-sandbox:8194
      - CODE_EXECUTION_API_KEY=dify-sandbox
      - CODE_MAX_NUMBER=9223372036854775807
      - CODE_MIN_NUMBER=-9223372036854775808
      - CODE_MAX_DEPTH=5
      - CODE_MAX_PRECISION=20
      - CODE_MAX_STRING_LENGTH=80000
      - SSRF_PROXY_HTTP_URL=http://dify-sandbox:8194
      - SSRF_PROXY_HTTPS_URL=http://dify-sandbox:8194
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/api/storage
      - OPENDAL_FS_ROOT=/app/api/storage
      - PLUGIN_DAEMON_URL=http://dify-plugin-daemon:5002
      - PLUGIN_DAEMON_KEY=${PLUGIN_DAEMON_KEY:-dify-plugin-daemon-key}
      - INNER_API_KEY_FOR_PLUGIN=${INNER_API_KEY_FOR_PLUGIN:-dify-inner-api-key}
      - PLUGIN_MAX_PACKAGE_SIZE=${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      - MARKETPLACE_API_URL=http://marketplace-proxy
      - MARKETPLACE_URL=http://marketplace-proxy
      - DIFY_MARKETPLACE_URL=http://marketplace-proxy
      - NO_PROXY=marketplace-proxy,dify-plugin-daemon,dify-sandbox,dify-api,dify-worker,dify-db,dify-redis,localhost,127.0.0.1
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-migration:
        condition: service_completed_successfully
      dify-storage-init:
        condition: service_completed_successfully
      dify-sandbox:
        condition: service_started
    networks:
      - devcontainer-network

  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify-web
    # expose:
    #   - "3000"
    environment:
      - EDITION=SELF_HOSTED
      - CONSOLE_API_URL=http://127.0.0.1:8010
      - APP_API_URL=http://127.0.0.1:8010
      - SENTRY_DSN=
      - APP_WEB_URL=http://127.0.0.1:8010
    depends_on:
      - dify-api
    networks:
      - devcontainer-network

  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.12
    container_name: dify-sandbox
    environment:
      - API_KEY=${SANDBOX_API_KEY:-dify-sandbox}
      - GIN_MODE=release
      - WORKER_TIMEOUT=15
      - ENABLE_NETWORK=true
    volumes:
      - dify-plugin-data:/dependencies
    networks:
      - devcontainer-network
    restart: unless-stopped

  dify-plugin-db-init:
    image: postgres:15-alpine
    container_name: dify-plugin-db-init
    command: >-
      sh -c "until pg_isready -h dify-db -U postgres; do sleep 1; done;
      psql -h dify-db -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'dify_plugin';\" | grep -q 1 ||
      psql -h dify-db -U postgres -c \"CREATE DATABASE dify_plugin\";"
    environment:
      - PGPASSWORD=postgres
    depends_on:
      dify-db:
        condition: service_healthy
    networks:
      - devcontainer-network
    restart: "no"

  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:main-local-linux-amd64
    container_name: dify-plugin-daemon
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify_plugin
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SERVER_PORT=5002
      - SERVER_KEY=${PLUGIN_DAEMON_KEY:-dify-plugin-daemon-key}
      - MARKETPLACE_API_URL=http://marketplace-proxy
      - MARKETPLACE_URL=http://marketplace-proxy
      - DIFY_MARKETPLACE_URL=http://marketplace-proxy
      - MAX_PLUGIN_PACKAGE_SIZE=${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      - DIFY_INNER_API_URL=http://dify-api:5001
      - DIFY_INNER_API_KEY=${INNER_API_KEY_FOR_PLUGIN:-dify-inner-api-key}
      - PLUGIN_REMOTE_INSTALLING_HOST=0.0.0.0
      - PLUGIN_REMOTE_INSTALLING_PORT=5003
      - PLUGIN_WORKING_PATH=/app/storage/cwd
      - FORCE_VERIFYING_SIGNATURE=false
      - PYTHON_ENV_INIT_TIMEOUT=120
      - PLUGIN_MAX_EXECUTION_TIMEOUT=600
      - PLUGIN_STDIO_BUFFER_SIZE=1024
      - PLUGIN_STDIO_MAX_BUFFER_SIZE=5242880
      - PIP_MIRROR_URL=
      - PLUGIN_STORAGE_TYPE=local
      - PLUGIN_STORAGE_LOCAL_ROOT=/app/storage
      - PLUGIN_INSTALLED_PATH=plugin
      - PLUGIN_PACKAGE_CACHE_PATH=plugin_packages
      - PLUGIN_MEDIA_CACHE_PATH=assets
    volumes:
      - dify-plugin-storage:/app/storage
    depends_on:
      dify-plugin-db-init:
        condition: service_completed_successfully
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-api:
        condition: service_started
    ports:
      - "5003:5003"
    networks:
      - devcontainer-network
    restart: unless-stopped

  dify-worker:
    image: langgenius/dify-api:latest
    container_name: dify-worker
    command: celery -A app.celery worker -P gevent -c 1 --loglevel INFO -Q dataset,generation,mail
    environment:
      - MODE=worker
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-xxxxx}
      - DATABASE_URL=postgresql://postgres:postgres@dify-db:5432/dify
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres@dify-db:5432/dify
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - VECTOR_STORE=pgvector
      - PGVECTOR_HOST=dify-db
      - PGVECTOR_PORT=5432
      - PGVECTOR_USER=postgres
      - PGVECTOR_PASSWORD=postgres
      - PGVECTOR_DB=dify
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://dify-redis:6379/1
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/api/storage
      - OPENDAL_FS_ROOT=/app/api/storage
      - CODE_EXECUTION_ENDPOINT=http://dify-sandbox:8194
      - CODE_EXECUTION_API_KEY=dify-sandbox
      - SSRF_PROXY_HTTP_URL=http://dify-sandbox:8194
      - SSRF_PROXY_HTTPS_URL=http://dify-sandbox:8194
      - PLUGIN_DAEMON_URL=http://dify-plugin-daemon:5002
      - PLUGIN_DAEMON_KEY=${PLUGIN_DAEMON_KEY:-dify-plugin-daemon-key}
      - INNER_API_KEY_FOR_PLUGIN=${INNER_API_KEY_FOR_PLUGIN:-dify-inner-api-key}
      - PLUGIN_MAX_PACKAGE_SIZE=${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      - MARKETPLACE_API_URL=http://marketplace-proxy
      - MARKETPLACE_URL=http://marketplace-proxy
      - DIFY_MARKETPLACE_URL=http://marketplace-proxy
      - NO_PROXY=marketplace-proxy,dify-plugin-daemon,dify-sandbox,dify-api,dify-worker,dify-db,dify-redis,localhost,127.0.0.1
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-migration:
        condition: service_completed_successfully
      dify-sandbox:
        condition: service_started
    networks:
      - devcontainer-network

  # Open WebUI Service
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "8080:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-secret-key-change-in-production}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-gpt-3.5-turbo,gpt-4}
      - ENABLE_SIGNUP=true
      - ENABLE_COMMUNITY_SHARING=false
    restart: unless-stopped
    networks:
      - devcontainer-network

  # LiteLLM Database
  litellm-db:
    image: postgres:15-alpine
    container_name: litellm-db
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:-litellm_password}
      - POSTGRES_DB=litellm
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - devcontainer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiteLLM Service
  litellm:
    image: ghcr.io/berriai/litellm:v1.80.0-stable.1
    container_name: litellm
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm_password}@litellm-db:5432/litellm
      - REDIS_URL=redis://litellm-redis:6379
      - CONFIG_FILE_PATH=/app/litellm_config.yaml
      - USE_PRISMA_MIGRATE=true
      - UI=true
      - ADMIN_UI=true
      - LOG_REQUESTS=true
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:-change-this-to-a-random-string}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-nftgo-1234-abcd}
      - LITELLM_LOG=INFO
      - STORE_MODEL_IN_DB=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_EXPORTER_OTLP_HEADERS=signoz-ingestion-key=litellm
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
    volumes:
      - litellm-data:/app/litellm
      - ./configs/litellm_config.yaml:/app/litellm_config.yaml:ro
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - devcontainer-network

  litellm-redis:
    image: redis:7-alpine
    container_name: litellm-redis
    ports:
      - "6380:6379"
    volumes:
      - litellm-redis-data:/data
    networks:
      - devcontainer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # n8n Services
  n8n-postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_POSTGRES_PASSWORD:-n8n_password}
      - POSTGRES_DB=n8n
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    networks:
      - devcontainer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    networks:
      - devcontainer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-server:
    image: n8nio/n8n:1.101.1
    container_name: n8n-server
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=UTC
      - N8N_LOG_LEVEL=info
      - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=30
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_LOG_OUTPUT=console
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - NODE_ENV=production
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_PUBLIC_API_ENDPOINT=api
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_HEARTBEAT_INTERVAL=30
      - N8N_RUNNERS_MAX_CONCURRENCY=20
      - N8N_RUNNERS_MODE=internal
      - N8N_RUNNERS_TASK_TIMEOUT=60
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:-n8n_password}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
      - N8N_METRICS_INCLUDE_API_ENDPOINTS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_DISABLE_UI=false
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - devcontainer-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  n8n-webhook:
    image: n8nio/n8n:1.101.1
    container_name: n8n-webhook
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    ports:
      - "5679:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: webhook
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=UTC
      - N8N_LOG_LEVEL=info
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:-n8n_password}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - devcontainer-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  n8n-worker:
    image: n8nio/n8n:1.101.1
    container_name: n8n-worker
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: worker
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - GENERIC_TIMEZONE=UTC
      - N8N_LOG_LEVEL=info
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=20
      - N8N_DEFAULT_BINARY_DATA_MODE=default
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=true
      - N8N_DISABLE_UI=true
      - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=30
      - N8N_LOG_OUTPUT=console
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - NODE_ENV=production
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_PUBLIC_API_DISABLED=true
      - N8N_PUBLIC_API_ENDPOINT=api
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_HEARTBEAT_INTERVAL=30
      - N8N_RUNNERS_MAX_CONCURRENCY=20
      - N8N_RUNNERS_MODE=internal
      - N8N_RUNNERS_TASK_TIMEOUT=60
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:-n8n_password}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - devcontainer-network

  # SigNoz Services
  signoz-init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-init-clickhouse
    command:
      - bash
      - -c
      - |
        cd /tmp
        tar -xvzf histogram-quantile.tar.gz
        mkdir -p /var/lib/clickhouse/user_scripts
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
        ls /var/lib/clickhouse/user_scripts
    restart: on-failure
    volumes:
      - signoz-clickhouse:/var/lib/clickhouse/
      - ./configs/signoz/histogram-quantile.tar.gz:/tmp/histogram-quantile.tar.gz
    networks:
      - devcontainer-network

  signoz-zookeeper-1:
    image: signoz/zookeeper:3.7.1
    container_name: signoz-zookeeper-1
    user: root
    restart: unless-stopped
    volumes:
      - signoz-zookeeper-1:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
    healthcheck:
      test:
        - CMD-SHELL
        - echo srvr | nc -w 3 localhost 2181 2>/dev/null | grep -q "Zookeeper version" && exit 0 || exit 1
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - devcontainer-network

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-clickhouse
    tty: true
    restart: unless-stopped
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper-1:
        condition: service_healthy
    volumes:
      - ./configs/signoz/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./configs/signoz/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./configs/signoz/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./configs/signoz/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - signoz-clickhouse:/var/lib/clickhouse/
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - 0.0.0.0:8123/ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - devcontainer-network

  signoz-schema-migrator-sync:
    image: signoz/signoz-schema-migrator:${OTELCOL_TAG:-v0.129.7}
    container_name: schema-migrator-sync
    command:
      - sync
      - --dsn=tcp://signoz-clickhouse:9000
      - --up=
    depends_on:
      signoz-zookeeper-1:
        condition: service_healthy
      signoz-clickhouse:
        condition: service_healthy
    restart: on-failure
    networks:
      - devcontainer-network

  signoz:
    image: signoz/signoz:${SIGNOZ_VERSION:-v0.97.0}
    container_name: signoz
    command:
      - --config=/root/config/prometheus.yml
    ports:
      - "3301:8080" # SigNoz UI (changed from 8080 to avoid conflict with Open WebUI)
    volumes:
      - ./configs/signoz/signoz/prometheus.yml:/root/config/prometheus.yml
      - ./configs/signoz/dashboards:/root/config/dashboards
      - signoz-sqlite:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - DASHBOARDS_PATH=/root/config/dashboards
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=true
      - DEPLOYMENT_TYPE=docker-standalone-amd
      - DOT_METRICS_ENABLED=true
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator-sync:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - localhost:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - devcontainer-network

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:${OTELCOL_TAG:-v0.129.7}
    container_name: signoz-otel-collector
    command:
      - --config=/etc/otel-collector-config.yaml
      - --manager-config=/etc/manager-config.yaml
      - --copy-path=/var/tmp/collector-config.yaml
      - --feature-gates=-pkg.translator.prometheus.NormalizeName
    volumes:
      - ./configs/signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./configs/signoz/signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devcontainer-network

  signoz-schema-migrator-async:
    image: signoz/signoz-schema-migrator:${OTELCOL_TAG:-v0.129.7}
    container_name: schema-migrator-async
    command:
      - async
      - --dsn=tcp://signoz-clickhouse:9000
      - --up=
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator-sync:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - devcontainer-network

  # Marketplace Proxy Service
  marketplace-proxy:
    image: nginx:alpine
    container_name: marketplace-proxy
    volumes:
      - ./configs/nginx/marketplace-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - devcontainer-network
    restart: unless-stopped

volumes:
  dify-db-data:
  dify-redis-data:
  dify-storage:
  dify-plugin-data:
  dify-plugin-storage:
  open-webui-data:
  litellm-data:
  litellm-db-data:
  litellm-redis-data:
  n8n-data:
  n8n-postgres-data:
  signoz-clickhouse:
  signoz-sqlite:
  signoz-zookeeper-1:

networks:
  devcontainer-network:
    driver: bridge
