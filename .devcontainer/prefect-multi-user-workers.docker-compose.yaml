# Multi-user workers configuration
# Use with: docker-compose -f prefect.docker-compose.yaml -f prefect-multi-user-workers.yaml --profile multi-user up -d

services:
  # Worker for Alice
  prefect-worker-alice:
    image: prefecthq/prefect:2-latest
    container_name: prefect-worker-alice
    command: >
      sh -c "
      export PREFECT_API_URL='http://prefect-server:4200/api' &&
      echo 'Starting worker for Alice...' &&
      prefect worker start --pool alice-pool
      "
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy
    volumes:
      - prefect-data:/root/.prefect
      - ../src/prefect-workspace:/workspace:ro
    networks:
      - prefect-network
    profiles:
      - multi-user
