services:
  # Nginx reverse proxy for Dify
  dify-nginx:
    image: nginx:alpine
    container_name: dify-nginx
    ports:
      - "${DIFY_HTTP_PORT:-8010}:80"
    volumes:
      - ./configs/nginx/dify.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dify-api
      - dify-web
    networks:
      - dify-network
    restart: unless-stopped

  # Dify Database
  dify-db:
    image: pgvector/pgvector:pg15
    container_name: dify-db
    environment:
      - POSTGRES_PASSWORD=${DIFY_DB_PASSWORD:-postgres}
      - POSTGRES_DB=dify
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - dify-db-data:/var/lib/postgresql/data
    networks:
      - dify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dify Redis
  dify-redis:
    image: redis:7-alpine
    container_name: dify-redis
    volumes:
      - dify-redis-data:/data
    networks:
      - dify-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dify Database Migration
  dify-migration:
    image: langgenius/dify-api:latest
    container_name: dify-migration
    environment:
      - MODE=api
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-xxxxx}
      - DATABASE_URL=postgresql://postgres:${DIFY_DB_PASSWORD:-postgres}@dify-db:5432/dify
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:${DIFY_DB_PASSWORD:-postgres}@dify-db:5432/dify
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DIFY_DB_PASSWORD:-postgres}
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/api/storage
      - OPENDAL_FS_ROOT=/app/api/storage
    volumes:
      - dify-storage:/app/api/storage
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Waiting for database to be ready..."
        sleep 5
        echo "Running database migrations..."
        cd /app/api
        flask db upgrade
        echo "Migrations completed successfully!"
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    networks:
      - dify-network
    restart: "no"

  # Dify Storage Initialization
  dify-storage-init:
    image: langgenius/dify-api:latest
    container_name: dify-storage-init
    user: root
    volumes:
      - dify-storage:/app/api/storage
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Fixing storage permissions..."
        chown -R 1001:1001 /app/api/storage
        chmod -R 755 /app/api/storage
        echo "Storage permissions fixed successfully!"
    networks:
      - dify-network
    restart: "no"

  # Dify API Service
  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify-api
    environment:
      - MODE=api
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-xxxxx}
      - DATABASE_URL=postgresql://postgres:${DIFY_DB_PASSWORD:-postgres}@dify-db:5432/dify
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:${DIFY_DB_PASSWORD:-postgres}@dify-db:5432/dify
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DIFY_DB_PASSWORD:-postgres}
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - VECTOR_STORE=pgvector
      - PGVECTOR_HOST=dify-db
      - PGVECTOR_PORT=5432
      - PGVECTOR_USER=postgres
      - PGVECTOR_PASSWORD=${DIFY_DB_PASSWORD:-postgres}
      - PGVECTOR_DB=dify
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://dify-redis:6379/1
      - WEB_API_CORS_ALLOW_ORIGINS=http://localhost:${DIFY_HTTP_PORT:-8010},http://127.0.0.1:${DIFY_HTTP_PORT:-8010},http://0.0.0.0:${DIFY_HTTP_PORT:-8010}
      - CONSOLE_CORS_ALLOW_ORIGINS=http://localhost:${DIFY_HTTP_PORT:-8010},http://127.0.0.1:${DIFY_HTTP_PORT:-8010},http://0.0.0.0:${DIFY_HTTP_PORT:-8010}
      - CONSOLE_WEB_URL=http://127.0.0.1:${DIFY_HTTP_PORT:-8010}
      - COOKIE_HTTPONLY=true
      - COOKIE_SAMESITE=Lax
      - COOKIE_SECURE=false
      - SESSION_TYPE=redis
      - SESSION_REDIS_HOST=dify-redis
      - SESSION_REDIS_PORT=6379
      - SESSION_REDIS_DB=2
      - CODE_EXECUTION_ENDPOINT=http://dify-sandbox:8194
      - CODE_EXECUTION_API_KEY=${SANDBOX_API_KEY:-dify-sandbox}
      - CODE_MAX_NUMBER=9223372036854775807
      - CODE_MIN_NUMBER=-9223372036854775808
      - CODE_MAX_DEPTH=5
      - CODE_MAX_PRECISION=20
      - CODE_MAX_STRING_LENGTH=80000
      - SSRF_PROXY_HTTP_URL=http://dify-sandbox:8194
      - SSRF_PROXY_HTTPS_URL=http://dify-sandbox:8194
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/api/storage
      - OPENDAL_FS_ROOT=/app/api/storage
      - PLUGIN_DAEMON_URL=http://dify-plugin-daemon:5002
      - PLUGIN_DAEMON_KEY=${PLUGIN_DAEMON_KEY:-dify-plugin-daemon-key}
      - INNER_API_KEY_FOR_PLUGIN=${INNER_API_KEY_FOR_PLUGIN:-dify-inner-api-key}
      - PLUGIN_MAX_PACKAGE_SIZE=${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      - MARKETPLACE_API_URL=http://marketplace-proxy
      - MARKETPLACE_URL=http://marketplace-proxy
      - DIFY_MARKETPLACE_URL=http://marketplace-proxy
      - NO_PROXY=marketplace-proxy,dify-plugin-daemon,dify-sandbox,dify-api,dify-worker,dify-db,dify-redis,localhost,127.0.0.1
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-migration:
        condition: service_completed_successfully
      dify-storage-init:
        condition: service_completed_successfully
      dify-sandbox:
        condition: service_started
    networks:
      - dify-network

  # Dify Web Service
  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify-web
    environment:
      - EDITION=SELF_HOSTED
      - CONSOLE_API_URL=http://127.0.0.1:${DIFY_HTTP_PORT:-8010}
      - APP_API_URL=http://127.0.0.1:${DIFY_HTTP_PORT:-8010}
      - SENTRY_DSN=
      - APP_WEB_URL=http://127.0.0.1:${DIFY_HTTP_PORT:-8010}
    depends_on:
      - dify-api
    networks:
      - dify-network

  # Dify Sandbox (Code Execution)
  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.12
    container_name: dify-sandbox
    environment:
      - API_KEY=${SANDBOX_API_KEY:-dify-sandbox}
      - GIN_MODE=release
      - WORKER_TIMEOUT=15
      - ENABLE_NETWORK=true
    volumes:
      - dify-plugin-data:/dependencies
    networks:
      - dify-network
    restart: unless-stopped

  # Dify Plugin Database Init
  dify-plugin-db-init:
    image: postgres:15-alpine
    container_name: dify-plugin-db-init
    command: >-
      sh -c "until pg_isready -h dify-db -U postgres; do sleep 1; done;
      psql -h dify-db -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'dify_plugin';\" | grep -q 1 ||
      psql -h dify-db -U postgres -c \"CREATE DATABASE dify_plugin\";"
    environment:
      - PGPASSWORD=${DIFY_DB_PASSWORD:-postgres}
    depends_on:
      dify-db:
        condition: service_healthy
    networks:
      - dify-network
    restart: "no"

  # Dify Plugin Daemon
  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:main-local-linux-amd64
    container_name: dify-plugin-daemon
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DIFY_DB_PASSWORD:-postgres}
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify_plugin
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SERVER_PORT=5002
      - SERVER_KEY=${PLUGIN_DAEMON_KEY:-dify-plugin-daemon-key}
      - MARKETPLACE_API_URL=http://marketplace-proxy
      - MARKETPLACE_URL=http://marketplace-proxy
      - DIFY_MARKETPLACE_URL=http://marketplace-proxy
      - MAX_PLUGIN_PACKAGE_SIZE=${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      - DIFY_INNER_API_URL=http://dify-api:5001
      - DIFY_INNER_API_KEY=${INNER_API_KEY_FOR_PLUGIN:-dify-inner-api-key}
      - PLUGIN_REMOTE_INSTALLING_HOST=0.0.0.0
      - PLUGIN_REMOTE_INSTALLING_PORT=5003
      - PLUGIN_WORKING_PATH=/app/storage/cwd
      - FORCE_VERIFYING_SIGNATURE=false
      - PYTHON_ENV_INIT_TIMEOUT=120
      - PLUGIN_MAX_EXECUTION_TIMEOUT=600
      - PLUGIN_STDIO_BUFFER_SIZE=1024
      - PLUGIN_STDIO_MAX_BUFFER_SIZE=5242880
      - PIP_MIRROR_URL=
      - PLUGIN_STORAGE_TYPE=local
      - PLUGIN_STORAGE_LOCAL_ROOT=/app/storage
      - PLUGIN_INSTALLED_PATH=plugin
      - PLUGIN_PACKAGE_CACHE_PATH=plugin_packages
      - PLUGIN_MEDIA_CACHE_PATH=assets
    volumes:
      - dify-plugin-storage:/app/storage
    depends_on:
      dify-plugin-db-init:
        condition: service_completed_successfully
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-api:
        condition: service_started
    ports:
      - "${DIFY_PLUGIN_PORT:-5003}:5003"
    networks:
      - dify-network
    restart: unless-stopped

  # Dify Worker (Celery)
  dify-worker:
    image: langgenius/dify-api:latest
    container_name: dify-worker
    command: celery -A app.celery worker -P gevent -c 1 --loglevel INFO -Q dataset,generation,mail
    environment:
      - MODE=worker
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-xxxxx}
      - DATABASE_URL=postgresql://postgres:${DIFY_DB_PASSWORD:-postgres}@dify-db:5432/dify
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:${DIFY_DB_PASSWORD:-postgres}@dify-db:5432/dify
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DIFY_DB_PASSWORD:-postgres}
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - VECTOR_STORE=pgvector
      - PGVECTOR_HOST=dify-db
      - PGVECTOR_PORT=5432
      - PGVECTOR_USER=postgres
      - PGVECTOR_PASSWORD=${DIFY_DB_PASSWORD:-postgres}
      - PGVECTOR_DB=dify
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://dify-redis:6379/1
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/api/storage
      - OPENDAL_FS_ROOT=/app/api/storage
      - CODE_EXECUTION_ENDPOINT=http://dify-sandbox:8194
      - CODE_EXECUTION_API_KEY=${SANDBOX_API_KEY:-dify-sandbox}
      - SSRF_PROXY_HTTP_URL=http://dify-sandbox:8194
      - SSRF_PROXY_HTTPS_URL=http://dify-sandbox:8194
      - PLUGIN_DAEMON_URL=http://dify-plugin-daemon:5002
      - PLUGIN_DAEMON_KEY=${PLUGIN_DAEMON_KEY:-dify-plugin-daemon-key}
      - INNER_API_KEY_FOR_PLUGIN=${INNER_API_KEY_FOR_PLUGIN:-dify-inner-api-key}
      - PLUGIN_MAX_PACKAGE_SIZE=${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      - MARKETPLACE_API_URL=http://marketplace-proxy
      - MARKETPLACE_URL=http://marketplace-proxy
      - DIFY_MARKETPLACE_URL=http://marketplace-proxy
      - NO_PROXY=marketplace-proxy,dify-plugin-daemon,dify-sandbox,dify-api,dify-worker,dify-db,dify-redis,localhost,127.0.0.1
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-migration:
        condition: service_completed_successfully
      dify-sandbox:
        condition: service_started
    networks:
      - dify-network

  # Marketplace Proxy
  marketplace-proxy:
    image: nginx:alpine
    container_name: marketplace-proxy
    volumes:
      - ./configs/nginx/marketplace-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dify-network
    restart: unless-stopped

volumes:
  dify-db-data:
    name: dify-db-data
  dify-redis-data:
    name: dify-redis-data
  dify-storage:
    name: dify-storage
  dify-plugin-data:
    name: dify-plugin-data
  dify-plugin-storage:
    name: dify-plugin-storage

networks:
  dify-network:
    driver: bridge