services:
  # n8n PostgreSQL Database
  n8n-postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_POSTGRES_PASSWORD:-n8n_password}
      - POSTGRES_DB=n8n
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # n8n Redis
  n8n-redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # n8n Server
  n8n-server:
    image: n8nio/n8n:1.101.1
    container_name: n8n-server
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5679/}
      - GENERIC_TIMEZONE=${N8N_TIMEZONE:-UTC}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=30
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_LOG_OUTPUT=console
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - NODE_ENV=production
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_PUBLIC_API_DISABLED=${N8N_PUBLIC_API_DISABLED:-false}
      - N8N_PUBLIC_API_ENDPOINT=api
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_HEARTBEAT_INTERVAL=30
      - N8N_RUNNERS_MAX_CONCURRENCY=20
      - N8N_RUNNERS_MODE=internal
      - N8N_RUNNERS_TASK_TIMEOUT=60
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:-n8n_password}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
      - N8N_METRICS_INCLUDE_API_ENDPOINTS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_DISABLE_UI=false
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # n8n Webhook Receiver
  n8n-webhook:
    image: n8nio/n8n:1.101.1
    container_name: n8n-webhook
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    ports:
      - "${N8N_WEBHOOK_PORT:-5679}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: webhook
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5679/}
      - GENERIC_TIMEZONE=${N8N_TIMEZONE:-UTC}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:-n8n_password}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # n8n Worker
  n8n-worker:
    image: n8nio/n8n:1.101.1
    container_name: n8n-worker
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: worker
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - GENERIC_TIMEZONE=${N8N_TIMEZONE:-UTC}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=20
      - N8N_DEFAULT_BINARY_DATA_MODE=default
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=true
      - N8N_DISABLE_UI=true
      - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=30
      - N8N_LOG_OUTPUT=console
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - NODE_ENV=production
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_PUBLIC_API_DISABLED=true
      - N8N_PUBLIC_API_ENDPOINT=api
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_HEARTBEAT_INTERVAL=30
      - N8N_RUNNERS_MAX_CONCURRENCY=20
      - N8N_RUNNERS_MODE=internal
      - N8N_RUNNERS_TASK_TIMEOUT=60
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:-n8n_password}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - n8n-network

volumes:
  n8n-data:
    name: n8n-data
  n8n-postgres-data:
    name: n8n-postgres-data

networks:
  n8n-network:
    driver: bridge