services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "${OPENWEBUI_PORT:-8080}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-secret-key-change-in-production}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-gpt-3.5-turbo,gpt-4}
      - ENABLE_SIGNUP=${OPENWEBUI_ENABLE_SIGNUP:-true}
      - ENABLE_COMMUNITY_SHARING=${OPENWEBUI_ENABLE_SHARING:-false}
    restart: unless-stopped
    networks:
      - openwebui-network

volumes:
  open-webui-data:
    name: open-webui-data

networks:
  openwebui-network:
    driver: bridge