services:
  # Temporal PostgreSQL Database
  temporal-postgres:
    image: postgres:15-alpine
    container_name: temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "${TEMPORAL_DB_PORT:-5436}:5432"
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - temporal-network

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.24.0
    container_name: temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    ports:
      - "${TEMPORAL_UI_PORT:-7233}:7233"
    networks:
      - temporal-network
    restart: unless-stopped

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:7233
    ports:
      - "${TEMPORAL_WEB_PORT:-8088}:8080"
    networks:
      - temporal-network
    restart: unless-stopped

volumes:
  temporal-postgres-data:
    driver: local

networks:
  temporal-network:
    driver: bridge
